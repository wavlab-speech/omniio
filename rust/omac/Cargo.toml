[package]
name = "omac"
version = "0.1.0"
edition = "2024"
# edition 2024; also the floor for users building from the sdist.
rust-version = "1.85"
description = "OMAC (Omniio Multichannel Audio Codec): lossless multichannel audio codec with random access in time and channels"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32c = "0.6.9"
rayon = "1.12.0"
numpy = { version = "0.30.0", optional = true }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"], optional = true }

[features]
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
crc32c = "0.6.9"
