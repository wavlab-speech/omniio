[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "omniio-omac"
version = "0.1.0"
description = "OMAC (Omniio Multichannel Audio Codec): lossless multichannel audio codec"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.maturin]
features = ["python"]
module-name = "omac"
